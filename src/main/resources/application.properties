server.port=8082

# Actuator 헬스 엔드포인트 설정 (Docker HEALTHCHECK / k8s probe 대응)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# 수동 Bean이 자동 Bean을 오버라이딩하게 설정
spring.main.allow-bean-definition-overriding=false

# open-in-view(혹은 Open-Session-In-View(OSIV))
# true(기본값) : 사용자에게 응답 또는 view가 렌더링될 때까지 영속성 컨텍스트 유지
# false : 트랜젝션이 종료될 때 영속성 컨텍스트 종료
# spring.jpa.open-in-view=false

# 애플리케이션 이름, 기본 실행 프로필, SQL 자동 초기화 설정
spring.application.name=erp
spring.profiles.default=dev
spring.sql.init.mode=never

# 로그인 세션 유지 시간 및 쿠키 보안 설정
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ERP_COOKIE_SECURE:false}

# MariaDB 드라이버 및 환경 변수로 받는 접속 정보
erp.datasource.driver-class-name=org.mariadb.jdbc.Driver
erp.datasource.url=${ERP_DB_URL}
erp.datasource.username=${ERP_DB_USER}
erp.datasource.password=${ERP_DB_PASSWORD}

# DB 연결 풀 크기, 트랜잭션 기본값, 연결 유효성 검사
erp.datasource.initial-size=2
erp.datasource.max-total=10
erp.datasource.default-auto-commit=true
erp.datasource.default-transaction-isolation=2
erp.datasource.validation-query=SELECT 1
erp.datasource.test-on-borrow=true

# 새 DB 연결에 적용할 시간대와 잠금 대기 시간
erp.datasource.connection-init-sqls[0]=SET time_zone = '+09:00'
erp.datasource.connection-init-sqls[1]=SET SESSION innodb_lock_wait_timeout = 5

# eGovFrame 세션 인증 및 접근 검사 경로 설정
Globals.Auth=session
org.egovframe.access.global-authen=session
org.egovframe.access.mapping-path=/**
org.egovframe.access.data-source=dataSource
org.egovframe.access.login-url=/login
org.egovframe.access.access-denied-url=/access-denied
org.egovframe.access.request-matcher-type=ant
org.egovframe.access.exclude-list=/login,/access-denied,/error,/css/**,/js/**,/img/**,/images/**,/favicon.ico

# 사용 중인 계정에 부여할 역할 및 역할별 접근 허용 경로
org.egovframe.access.sql-authority-user=SELECT login_id AS userid, 'ROLE_ERP_USER' AS authority FROM erp_user WHERE is_active='Y'
org.egovframe.access.sql-role-and-url=SELECT 'ROLE_ERP_USER' AS authority, '/items/**' AS url UNION ALL SELECT 'ROLE_ERP_USER','/clinics/**' UNION ALL SELECT 'ROLE_ERP_USER','/receipts/**' UNION ALL SELECT 'ROLE_ERP_USER','/orders/**' UNION ALL SELECT 'ROLE_ERP_USER','/stocks' UNION ALL SELECT 'ROLE_ERP_USER','/stock-movements' UNION ALL SELECT 'ROLE_ERP_USER','/logout' UNION ALL SELECT 'ROLE_ERP_USER','/'
